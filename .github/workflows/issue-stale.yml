name: Close inactive issues
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  close-issues:
    runs-on: ubuntu-latest
    # No `actions: write`, which actions/stale needs to save its progress
    # between runs (in the Actions cache). Without it, each run starts again
    # from the newest issue. That's fine while a run gets through every issue
    # within `operations-per-run`; grant it if the backlog outgrows that.
    # No `contents: write`: it's only for the `delete-branch` option.
    permissions:
      issues: write # to label, comment on, and close issues
      pull-requests: read # PRs are listed but never marked stale

    steps:
      - uses: actions/stale@v11
        with:
          ascending: false
          operations-per-run: 100
          days-before-issue-stale: 90
          days-before-issue-close: 7
          stale-issue-label: "Issue: Stale"
          exempt-issue-labels: "Issue: Accepted"
          stale-issue-message: "This issue is stale because it has been open for 90 days with no activity. If there is no activity in the next 7 days, the issue will be closed."
          close-issue-message: "This issue was closed because it has been inactive for 7 days since being marked as stale. Please open a new issue if you believe you are encountering a related problem."
          days-before-pr-stale: -1
          days-before-pr-close: -1
          enable-statistics: true
