name: CI

# Runs build and test on:
#   every push to main or a 2026 uplift integration branch (chore/2026-uplift*)
#   every pull request with either as the base
on:
  push:
    branches:
      - main
      - chore/2026-uplift*
  pull_request:
    branches:
      - main
      - chore/2026-uplift*

# Reset permissions and grant them per job.
permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_CACHE_DIR: .turbo/cache
  # Pull requests only run tasks for packages changed since the base branch
  # (and their dependents). Pushes run everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `--affected` diffs against the base branch.
          fetch-depth: 0
      - uses: $/.github/actions/setup
      # Saved at the end of the job; the test job restores it to reuse builds.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-build-

      - name: Check all package.json's and tsconfig.json's are in sync.
        run: |
          pnpm sync
          git diff --no-ext-diff --quiet --exit-code

      - name: Build
        run: pnpm build $AFFECTED

      - name: Types
        run: pnpm types:check $AFFECTED

      - name: Check published packages
        run: pnpm pack:check $AFFECTED

  # Format and lint need nothing built, so they run alongside build. Each checks
  # the whole repo in about a second, so they skip Turborepo and `--affected`.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      # Same config as `pnpm lint:gha` (.github/zizmor.yml).
      - name: Lint GitHub Actions
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          # The default, set explicitly: online audits include impostor-commit,
          # which checks that each SHA pin is a commit in the action's own repo.
          online-audits: true
          advanced-security: false
          annotations: true

  test:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup
      # This run's builds, from the build job.
      - uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}

      - name: Test
        run: pnpm test $AFFECTED

      # All packages, uncached. Reported in the job summary, not gated (#2348):
      # a coverage failure shows as a warning, and the Test step gates.
      - name: Coverage
        continue-on-error: true
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            if [ -f coverage/summary.txt ]; then
              echo '```'
              cat coverage/summary.txt
              echo '```'
            else
              echo 'No coverage summary (the Coverage step failed or was skipped).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
