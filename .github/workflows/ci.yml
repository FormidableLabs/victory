name: CI

# Runs build and test on:
#   every push to main or a 2026 uplift integration branch (chore/2026-uplift*)
#   every pull request with either as the base
on:
  push:
    branches:
      - main
      - chore/2026-uplift*
  pull_request:
    branches:
      - main
      - chore/2026-uplift*

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_CACHE_DIR: .turbo/cache
  # Pull requests only run tasks for packages changed since the base branch
  # (and their dependents). Pushes run everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--affected` diffs against the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Saved at the end of the job; the test job restores it to reuse builds.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-build-

      - name: Check all package.json's and tsconfig.json's are in sync.
        run: |
          pnpm sync
          git diff --no-ext-diff --quiet --exit-code

      - name: Build
        run: pnpm build $AFFECTED

      - name: Types
        run: pnpm types:check $AFFECTED

      - name: Check published packages
        run: pnpm pack:check $AFFECTED

  # Lint needs nothing built, so it runs alongside build with its own cache.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-lint-

      - name: Lint
        run: pnpm lint $AFFECTED

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # This run's builds, from the build job.
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}

      - name: Test
        run: pnpm test $AFFECTED

      # All packages, uncached. Reported in the job summary, not gated (#2348):
      # a coverage failure shows as a warning, and the Test step gates.
      - name: Coverage
        continue-on-error: true
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            if [ -f coverage/summary.txt ]; then
              echo '```'
              cat coverage/summary.txt
              echo '```'
            else
              echo 'No coverage summary (the Coverage step failed or was skipped).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
