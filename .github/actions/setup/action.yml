name: Setup
description: Setup Build Step

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v6

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install
